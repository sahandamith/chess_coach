<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7424676034162765"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback &amp; suggestions – Chess Coach</title>
  <link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body>
  <header class="site-header">
    <h1>Chess Coach</h1>
    <nav>
      <a href="/">Analyze</a>
      <a href="/feedback">Feedback &amp; suggestions</a>
    </nav>
  </header>
  <div class="container">
    <div class="card">
      <h2>Feedback &amp; suggestions</h2>
      <p>Your ideas help improve this tool. Tell us what you’d like to see: new features, clearer explanations, or fixes.</p>
      <form id="feedback-form" class="feedback-form">
        <label for="feedback-comment">Comment or suggestion</label>
        <textarea id="feedback-comment" name="comment" required rows="5" placeholder="e.g. Add support for batch analysis, or: the mistake labels could show the move number..."></textarea>
        <label for="feedback-email">Email (optional, if you want a reply)</label>
        <input type="email" id="feedback-email" name="email" placeholder="you@example.com" />
        <button type="submit" id="feedback-submit">Send feedback</button>
      </form>
      <div id="feedback-message" class="feedback-message" style="display: none;"></div>
    </div>
    <div class="card">
      <h2>Suggestions &amp; comments</h2>
      <p>What others have suggested. Add yours above.</p>
      <div id="feedback-list" class="feedback-list">Loading…</div>
    </div>
    <p><a href="/">← Back to analysis</a></p>
  </div>
  <script>
    document.getElementById('feedback-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const comment = document.getElementById('feedback-comment').value.trim();
      const email = document.getElementById('feedback-email').value.trim() || null;
      const msgEl = document.getElementById('feedback-message');
      const btn = document.getElementById('feedback-submit');
      if (!comment) return;
      btn.disabled = true;
      msgEl.style.display = 'none';
      try {
        const r = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment: comment, email: email })
        });
        const text = await r.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) {}
        if (r.ok) {
          msgEl.textContent = 'Thanks! Your feedback was sent.';
          msgEl.className = 'feedback-message feedback-message-success';
          document.getElementById('feedback-comment').value = '';
          document.getElementById('feedback-email').value = '';
        } else {
          msgEl.textContent = data && data.detail ? data.detail : 'Something went wrong. Please try again.';
          msgEl.className = 'feedback-message feedback-message-error';
        }
      } catch (err) {
        msgEl.textContent = 'Network error. Please try again.';
        msgEl.className = 'feedback-message feedback-message-error';
      }
      msgEl.style.display = 'block';
      btn.disabled = false;
      if (r.ok) loadFeedbackList();
    });

    function formatDate(ts) {
      if (ts == null) return '—';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString(undefined, { dateStyle: 'medium' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    function loadFeedbackList() {
      const el = document.getElementById('feedback-list');
      if (!el) return;
      fetch('/api/feedback').then(function (r) { return r.json(); }).then(function (data) {
        const list = (data && data.feedback) || [];
        if (list.length === 0) {
          el.innerHTML = '<p class="feedback-list-empty">No suggestions yet. Be the first!</p>';
          return;
        }
        el.innerHTML = '<ul class="feedback-entries">' + list.map(function (item) {
          const date = formatDate(item.ts);
          const comment = (item.comment || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
          return '<li class="feedback-entry"><span class="feedback-entry-date">' + date + '</span><div class="feedback-entry-comment">' + comment + '</div></li>';
        }).join('') + '</ul>';
      }).catch(function () {
        el.innerHTML = '<p class="feedback-list-empty">Could not load suggestions.</p>';
      });
    }
    loadFeedbackList();
  </script>
</body>
</html>
